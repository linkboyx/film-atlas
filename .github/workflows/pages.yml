name: Update data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_imdb:
        description: Refresh IMDb ratings before publishing
        type: boolean
        default: true
  schedule:
    # 07:23 America/Phoenix / 22:23 Asia/Shanghai, daily.
    - cron: '23 14 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test updater
        run: node --test scripts/update-imdb.test.mjs
      - name: Refresh existing films from official IMDb dataset
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_imdb
        run: node scripts/update-imdb.mjs
      - name: Verify complete website without local research cache
        run: node verify-catalog.mjs --site-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v5

